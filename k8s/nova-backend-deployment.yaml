apiVersion: apps/v1
kind: Deployment

metadata:
  name: nova-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nova-backend

  template:
    metadata:
      labels:
        app: nova-backend

    spec:
      containers:
        - name: nova-backend
          image: ghcr.io/datawithtushar/nova-backend:latest

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: nova-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20